[project]
name = "stt"
version = "0.1.0"
description = "Speech to text tool based on whisper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper>=20250625",
    "rich>=14.1.0",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "typer>=0.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]


