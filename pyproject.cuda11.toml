[project]
name = "stt"
version = "0.1.0"
description = "Speech to text tool based on whisper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "rich>=14.1.0",
    "torch",
    "torchaudio",
    # "torchcodec",
    "typer>=0.16.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = ["ruff>=0.12.7"]

# CUDA 11.4 配置
[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
